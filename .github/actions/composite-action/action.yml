name: "Composite Action Example"
description: "Runs linter and formatter-2"
runs:
  using: "composite"
  steps:
    - name: 计算哈希
      uses: seepine/hash-files@v1
      id: get-hash
      with:
        patterns: |-
          package.json
          package-lock.json

    - name: 设置缓存
      uses: actions/cache@v3
      with:
        key: deploy-web-${{ steps.get-hash.outputs.hash }}
        path: node_modules
        restore-keys: |
          deploy-web-

    - name: 安装依赖
      run: |
        echo "npm install"
        if [ "${{ steps.npm-cache.outputs.cache-hit }}" != "true" ]; then
          npm i --registry=https://registry.npmmirror.com
        fi
      shell: bash

    - name: 执行编译
      run: npm run build:${{env.MODE}}
      shell: bash

    # - name: Debug Network
    #   run: |
    #     curl -v https://github.com
    #     git ls-remote https://github.com/mingchangge/deployWeb.git
    #   shell: bash
    - name: 构建准备
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=192.168.21.157:5000/moby/buildkit:latest #指定用于运行 BuildKit 的容器镜像
          network=host

    # - name: Disable TLS (for GitHub Actions)
    #   run: echo "DOCKER_TLS_VERIFY=0" >> $GITHUB_ENV
    #   shell: bash

    # - name: Verify Docker connection
    #   run: |
    #     docker info
    #     docker version
    #   shell: bash

    # - name: 验证 Docker 环境
    #   run: |
    #     echo "Docker 版本信息:"
    #     docker version
    #     echo "Docker 守护进程配置:"
    #     docker info | grep -E "Hostname|Server Version|Root Dir|HTTP Proxy"
    #     echo "检查 Buildx 插件:"
    #     ls -la /home/runner/.docker/cli-plugins/
    #   shell: bash

    - name: 构建和发布镜像
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: myDockerHub/deploy-web:${{env.docker-tag}}

    # - name: 更新镜像
