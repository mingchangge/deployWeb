name: "Composite Action Example"
description: "Runs linter and formatter"
runs:
  using: "composite"
  steps:
    - name: 计算哈希
      uses: seepine/hash-files@v1
      id: get-hash
      with:
        patterns: |-
          package.json
          package-lock.json

    - name: 设置缓存
      uses: actions/cache@v3
      with:
        key: deploy-web-${{ steps.get-hash.outputs.hash }}
        path: node_modules
        restore-keys: |
          deploy-web-

    - name: 安装依赖
      run: |
        echo "npm install"
        if [ "${{ steps.npm-cache.outputs.cache-hit }}" != "true" ]; then
          npm i --registry=https://registry.npmmirror.com
        fi
      shell: bash

    - name: 执行编译
      run: npm run build:${{env.MODE}}
      shell: bash

    - name: 构建准备
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=ghub.webterren.com/buildkit
        network: host # 启用宿主机网络模式
    
    - name: Set up Docker Buildx
      run: |
        docker buildx create --use
        docker buildx inspect --bootstrap
      shell: bash

    - name: Configure network
      run: |
        echo '{"experimental":"enabled","registry-mirrors":[],"insecure-registries":["my-registry.lxq.com:1443"]}' > /etc/docker/daemon.json
        systemctl restart docker
      shell: bash

    - name: Test registry connectivity
      run: |
        docker run --rm --network=host alpine \
          sh -c 'apk add curl && curl -vk https://my-registry.lxq.com:1443/v2/'
      shell: bash

    - name: 构建和发布镜像
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: my-registry.lxq.com:1443/deploy-web:${{env.docker-tag}}

