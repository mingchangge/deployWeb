name: "Composite Action Example"
description: "Runs linter and formatter1-20250401"

runs:
  using: "composite"
  steps:
    - name: 计算哈希
      uses: seepine/hash-files@v1
      id: get-hash
      with:
        patterns: |-
          package.json
          package-lock.json

    - name: 设置缓存
      uses: actions/cache@v3
      with:
        key: deploy-web-${{ steps.get-hash.outputs.hash }}
        path: node_modules
        restore-keys: |
          deploy-web-

    - name: 安装依赖
      run: |
        echo "npm install"
        if [ "${{ steps.npm-cache.outputs.cache-hit }}" != "true" ]; then
          npm i --registry=https://registry.npmmirror.com
        fi
      shell: bash

    - name: 执行编译
      run: npm run build:${{env.MODE}}
      shell: bash

    # - name: Debug Network
    #   run: |
    #     curl -v https://github.com
    #     git ls-remote https://github.com/mingchangge/deployWeb.git
    #   shell: bash

